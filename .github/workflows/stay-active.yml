name: keep the schedule enabled

on:
  schedule:
    # GitHub turns off scheduled workflows after 60 days without a commit.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record that the keepalive is still wanted
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > last-run.txt
          git config user.name "naomiface-keepalive"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-run.txt
          git diff --cached --quiet || git commit -m "Keep the scheduled ping enabled"
          git push
