name: keep naomiface awake

on:
  schedule:
    # Render spins a free web service down after 15 idle minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the landing server
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --retry-all-errors --max-time 120 \
            https://naomiface.co/api/awake \
            || curl --fail --silent --show-error --retry 2 --retry-delay 5 --retry-all-errors --max-time 120 \
              https://naomiface.co/
